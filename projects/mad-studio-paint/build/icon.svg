<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5266"/>
      <stop offset="1" stop-color="#262a33"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5c"/>
      <stop offset="0.5" stop-color="#f2557a"/>
      <stop offset="1" stop-color="#8f6cf5"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#b9c1d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="190" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="190" fill="none" stroke="#ffffff22" stroke-width="6"/>
  <!-- Paper -->
  <rect x="196" y="236" width="520" height="600" rx="26" fill="#fbfbfd" transform="rotate(-6 456 536)" filter="url(#shadow)"/>
  <!-- Brush stroke forming an M -->
  <path d="M262 720 C 300 540, 330 420, 360 380 C 392 338, 420 470, 452 560 C 486 470, 520 330, 560 352 C 600 374, 610 560, 640 690"
        fill="none" stroke="url(#stroke)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pen nib -->
  <g transform="translate(-14 44) rotate(38 760 330) translate(760 330) scale(0.84) translate(-760 -330)" filter="url(#shadow)">
    <path d="M760 120 L 840 330 L 760 560 L 680 330 Z" fill="url(#nib)"/>
    <path d="M760 330 L 760 560" stroke="#3a4152" stroke-width="10"/>
    <circle cx="760" cy="330" r="22" fill="#3a4152"/>
    <rect x="690" y="40" width="140" height="120" rx="20" fill="#2e3342"/>
  </g>
</svg>
