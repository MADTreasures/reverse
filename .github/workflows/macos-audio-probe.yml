name: macOS audio device probe (temporary diagnostic)

# Checks whether the input device of a hosted macOS runner delivers IO callbacks to a process
# without microphone permission (the engine's callback runs from the input device when input and
# output are separate devices). Removed after use.

on:
  push:
    paths:
      - '.github/workflows/macos-audio-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Input and output IO callbacks, plain binary and app bundle
        run: |
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          cat > io-probe.m <<'EOF'
          #import <AVFoundation/AVFoundation.h>
          #include <CoreAudio/CoreAudio.h>
          #include <stdio.h>
          #include <unistd.h>

          static volatile int callbacks = 0;

          static OSStatus ioProc (AudioObjectID dev, const AudioTimeStamp* now, const AudioBufferList* in, const AudioTimeStamp* inTime,
                                  AudioBufferList* out, const AudioTimeStamp* outTime, void* ctx)
          {
              ++callbacks;
              return noErr;
          }

          static AudioObjectID defaultDevice (AudioObjectPropertySelector sel)
          {
              AudioObjectPropertyAddress a = { sel, kAudioObjectPropertyScopeGlobal, kAudioObjectPropertyElementMain };
              AudioObjectID dev = 0;
              UInt32 size = sizeof (dev);
              AudioObjectGetPropertyData (kAudioObjectSystemObject, &a, 0, NULL, &size, &dev);
              return dev;
          }

          static void run (const char* label, AudioObjectID dev)
          {
              callbacks = 0;
              AudioDeviceIOProcID proc = NULL;
              OSStatus e1 = AudioDeviceCreateIOProcID (dev, ioProc, NULL, &proc);
              OSStatus e2 = AudioDeviceStart (dev, proc);
              usleep (1500000);
              printf ("  %s device %u: create %d, start %d, %d IO callbacks in 1.5 s\n", label, (unsigned) dev, (int) e1, (int) e2, callbacks);
              AudioDeviceStop (dev, proc);
              AudioDeviceDestroyIOProcID (dev, proc);
          }

          int main (int argc, char** argv)
          {
              @autoreleasepool
              {
                  const char* names[] = { "notDetermined", "restricted", "denied", "authorized" };
                  AVAuthorizationStatus s = [AVCaptureDevice authorizationStatusForMediaType: AVMediaTypeAudio];
                  NSString* bundleId = [[NSBundle mainBundle] bundleIdentifier];
                  if (bundleId == nil)
                      bundleId = @"(none)";
                  printf ("%s: bundle %s, microphone authorization: %s\n", argc > 1 ? argv[1] : "probe",
                          [bundleId UTF8String], names[(int) s]);
                  run ("output", defaultDevice (kAudioHardwarePropertyDefaultOutputDevice));
                  run ("input ", defaultDevice (kAudioHardwarePropertyDefaultInputDevice));
              }
              return 0;
          }
          EOF
          clang -O2 -fobjc-arc -o io-probe io-probe.m -framework AVFoundation -framework CoreAudio -framework Foundation
          ./io-probe "plain binary"

          mkdir -p "Probe.app/Contents/MacOS"
          cp io-probe "Probe.app/Contents/MacOS/Probe"
          cat > Probe.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>io.github.madtreasures.probe</string>
            <key>CFBundleExecutable</key><string>Probe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSUIElement</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>probe</string>
          </dict></plist>
          EOF
          codesign --force --sign - Probe.app
          "Probe.app/Contents/MacOS/Probe" "app bundle (spawned like the engine)"
          echo "--- spawned from node, as Electron spawns the engine"
          node -e "require('child_process').spawnSync('Probe.app/Contents/MacOS/Probe', ['app bundle via node'], { stdio: 'inherit' })"
