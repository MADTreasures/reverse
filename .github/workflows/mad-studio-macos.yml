name: MAD Studio · macOS app

on:
  push:
    branches: ['**']
    tags: ['mad-studio-v*']
    paths:
      - 'projects/mad-studio/**'
      - '.github/workflows/mad-studio-macos.yml'
  workflow_dispatch:

concurrency:
  group: mad-studio-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build DMG (arm64 + x64)
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/mad-studio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/mad-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build web bundle
        run: npm run build

      - name: Stage native engine (if built)
        run: node scripts/stage-engine.mjs

      - name: Package macOS app (DMG, ad-hoc signed)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test the packaged app
        run: |
          ls -la release
          "release/mac-arm64/MAD Studio.app/Contents/MacOS/MAD Studio" --smoke-test

      - name: Upload app (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: MAD-Studio-macOS-Apple-Silicon
          path: projects/mad-studio/release/*-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload app (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: MAD-Studio-macOS-Intel
          path: projects/mad-studio/release/*-x64.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/mad-studio-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MAD-Studio-macOS-*
          merge-multiple: true
          path: dist

      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MAD Studio ${GITHUB_REF_NAME#mad-studio-v}" \
            --notes "macOS build of MAD Studio (Apple Silicon: arm64, Intel: x64). The app is not notarized – see projects/mad-studio/README.md for first-launch instructions."
        env:
          GH_TOKEN: ${{ github.token }}
