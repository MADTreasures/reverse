name: MAD Studio · CI

on:
  push:
    paths:
      - 'projects/mad-studio/**'
      - '.github/workflows/mad-studio-ci.yml'
  pull_request:
    paths:
      - 'projects/mad-studio/**'
      - '.github/workflows/mad-studio-ci.yml'
  workflow_dispatch:

concurrency:
  group: mad-studio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/mad-studio

jobs:
  test:
    name: Typecheck · unit · build · e2e · Electron
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Reject file names that collide on case-insensitive file systems (macOS)
        working-directory: .
        run: |
          dupes=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "These paths differ only in letter case and break checkouts on macOS:"
            echo "$dupes"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/mad-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Electron smoke test
        # GitHub's Ubuntu runners cannot use Chromium's setuid sandbox.
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mad-studio-playwright-report
          path: projects/mad-studio/playwright-report
          retention-days: 7

  engine:
    name: Native engine (Linux) · build · self-test · protocol test · desktop app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/mad-studio/package-lock.json

      - name: Configure (downloads JUCE 8.0.15 and checks its SHA256)
        run: cmake -S engine -B engine/build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAD_BUILD_TEST_PLUGINS=ON

      - name: Build engine and test plugins
        run: cmake --build engine/build/Release -j4

      - name: Engine self-test
        run: engine/build/Release/mad-engine --self-test

      - name: Engine protocol test (stdio, VST3 test plugins, stress)
        run: node engine/tests/protocol-test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Electron smoke test with the native engine
        run: |
          xvfb-run -a npx electron . --smoke-test --no-sandbox | tee smoke.log
          grep -q MAD_STUDIO_ENGINE_PONG smoke.log
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Desktop app + native engine (playback, plugins, render, plugin state)
        run: xvfb-run -a npx playwright test -c playwright.native.config.ts
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

